    <!--
      Everything between the markers below is per-route and is replaced at build
      time by scripts/prerender.mjs, which reads src/seo/siteMeta.js. What is
      here now is only the fallback used by `npm run dev`, where no prerender
      step runs; in dev, src/components/Seo.jsx overwrites it on mount.

      Do not add page metadata outside the markers — it would survive the
      replacement and end up duplicated on every prerendered page.
    -->
    <!--seo-head-start-->
    <title>SKKU Global — Web Development &amp; SecuScan Security Audits</title>
    <meta
      name="description"
      content="SKKU Global Technologies Limited engineers custom full-stack web applications, runs SecuScan vulnerability audits, and ships e-commerce systems for clients worldwide."
    />
    <link rel="canonical" href="https://skkuglobal.com/" />
    <!--seo-head-end-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
